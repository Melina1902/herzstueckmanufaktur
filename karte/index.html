<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Herzstückmanufaktur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --schwarz: #111111;
      --weiss:   #ffffff;
      --gold:    #8B6914;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--schwarz);
      color: var(--weiss);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .kasten { max-width: 460px; }
    .marke {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--gold);
      margin-bottom: 2rem;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      line-height: 1.35;
      margin-bottom: 1.6rem;
    }
    a.zurueck {
      display: inline-block;
      border: 2px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      padding: 0.8rem 1.6rem;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    a.zurueck:hover { background: var(--gold); color: var(--schwarz); }
    .warten { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="kasten">
    <p class="marke">Herzstückmanufaktur</p>
    <div id="inhalt"><p class="warten">Einen Moment.</p></div>
    <noscript>
      <h1>Der gewünschte Inhalt ist gerade nicht erreichbar.</h1>
      <a class="zurueck" href="/">Zur Herzstückmanufaktur</a>
    </noscript>
  </div>

  <script>
    // Feste Adresse fuer den QR-Code der gedruckten Karte.
    // Das Ziel steht ausschliesslich in /data/karte-ziel.json und wird
    // dort gepflegt. Diese Datei bleibt unveraendert, damit der
    // gedruckte Code nie nachgezogen werden muss.
    (function () {
      var fehler = function () {
        document.getElementById('inhalt').innerHTML =
          '<h1>Der gewünschte Inhalt ist gerade nicht erreichbar.</h1>' +
          '<a class="zurueck" href="/">Zur Herzstückmanufaktur</a>';
      };

      // Nur eigene Pfade und vollstaendige HTTPS-Adressen sind erlaubt.
      // Damit kann ein Tippfehler in der JSON-Datei die Seite nicht in
      // eine Weiterleitung auf etwas Fremdes verwandeln.
      var erlaubt = function (ziel) {
        return typeof ziel === 'string' &&
               (ziel.charAt(0) === '/' || ziel.indexOf('https://') === 0);
      };

      // Zeitstempel und no-store, damit nach einer Aenderung nicht die
      // alte Datei aus dem Browser- oder CDN-Cache kommt.
      fetch('/data/karte-ziel.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (antwort) {
          if (!antwort.ok) { throw new Error(antwort.status); }
          return antwort.json();
        })
        .then(function (daten) {
          if (daten && erlaubt(daten.ziel)) {
            window.location.replace(daten.ziel);
          } else {
            fehler();
          }
        })
        .catch(fehler);
    })();
  </script>
</body>
</html>
